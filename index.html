<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#b9dddc" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2383dff3' d='M32 31C8 10 2 38 26 35 8 55 38 59 32 37c4 23 34 13 9-3 24 2 17-27-7-3z'/%3E%3Ccircle cx='32' cy='34' r='5' fill='%23fff6ca'/%3E%3C/svg%3E" />
    <meta name="description" content="Ranran's Fantasy Meadow — 嘉然的梦幻草原 3D 立体场景" />
    <title>Ranran's Fantasy Meadow</title>
  </head>
  <body>
    <main id="app" aria-label="Ranran's Fantasy Meadow 3D scene">
      <div id="scene-container"></div>

      <header class="hero-title">
        <div class="eyebrow"><span></span> A LITTLE GIRL IN A FANTASY WORLD</div>
        <h1>Ranran’s<br /><em>Fantasy Meadow</em></h1>
        <p>追随微光，走进嘉然的童话草原</p>
      </header>

      <aside class="character-note">
        <span class="note-index">01</span>
        <div>
          <strong>嘉然 · RANRAN</strong>
          <small>正在追逐魔法蝴蝶</small>
        </div>
      </aside>

      <nav class="scene-controls" aria-label="场景控制">
        <button id="reset-camera" type="button" aria-label="重置镜头" title="重置镜头">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.9 4.9v5h5M5.1 9.8A7.5 7.5 0 1 1 4.7 15"/></svg>
          <span>重置视角</span>
        </button>
        <button id="toggle-rotate" class="active" type="button" aria-pressed="true" aria-label="切换自动旋转" title="切换自动旋转">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2A8 8 0 1 1 4.1 9M4 4v5h5"/></svg>
          <span>自动巡游</span>
        </button>
        <button id="toggle-music" type="button" aria-pressed="false" aria-label="切换环境音" title="切换环境音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12M6 20a3 2 0 1 0 0-4 3 2 0 1 0 0 4Zm10-2a3 2 0 1 0 0-4 3 2 0 1 0 0 4Z"/></svg>
          <span>草原风声</span>
        </button>
        <button id="load-local-model" type="button" aria-label="选择本地 GLB 角色" title="仅在浏览器本地读取 GLB，不会上传">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l2-2h9v13h-17zM12 10v6m-3-3h6"/></svg>
          <span>本地 GLB</span>
        </button>
        <button id="use-procedural-model" type="button" aria-label="切回程序化角色" title="切回程序化角色" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2A8 8 0 1 1 4.1 9M4 4v5h5"/></svg>
          <span>程序角色</span>
        </button>
      </nav>
      <input id="local-model-input" type="file" accept=".glb,model/gltf-binary" hidden />
      <div id="model-status" class="model-status" role="status" aria-live="polite" hidden></div>

      <div class="interaction-hint">
        <span class="mouse-icon"><i></i></span>
        拖动探索 · 滚轮缩放
      </div>

      <div class="phase-badge"><b>PHASE</b><span>01</span></div>

      <div id="loading-screen" aria-live="polite">
        <div class="loader-flower"><i></i><i></i><i></i><i></i><span></span></div>
        <p>草原正在苏醒…</p>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
